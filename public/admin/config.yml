# Admin editor (Sveltia CMS) for arhideea.ro
# Every save becomes a commit on GitHub; Cloudflare Pages rebuilds the site in ~2 minutes.

backend:
  name: github
  repo: cr1st1opr3a/arhideea-site
  branch: main
  auth_methods: [token]
  commit_messages:
    create: 'Proiect nou: {{slug}}'
    update: 'Actualizare: {{slug}}'
    delete: 'Ștergere: {{slug}}'
    uploadMedia: 'Imagine încărcată: {{path}}'
    deleteMedia: 'Imagine ștearsă: {{path}}'

app_title: Arhideea · Administrare
site_url: https://www.arhideea.ro
display_url: https://www.arhideea.ro
logo_url: /favicon.svg

# Images not tied to a project (e.g. team portraits) go here.
media_folder: public/uploads
public_folder: /uploads

# Uploaded photos are converted to WebP, max 2400 px, before they are saved
# (this also drops camera/GPS metadata). Astro makes the smaller sizes at build time.
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2400
        height: 2400

collections:
  - name: projects
    label: Proiecte
    label_singular: Proiect
    description: Fiecare proiect are propriul folder cu text și fotografii. Fotografiile încărcate aici sunt optimizate automat pentru web.
    folder: src/content/projects
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    create: true
    delete: true
    slug: '{{title}}'
    identifier_field: title
    summary: '{{title}} — {{location}}'
    sortable_fields: [order, title]
    view_filters:
      - { label: Construcții eficiente energetic, field: categories, pattern: Construcții eficiente energetic }
      - { label: Structuri din lemn, field: categories, pattern: Structuri din lemn }
      - { label: Locuințe, field: categories, pattern: Locuințe }
      - { label: Amenajări interioare, field: categories, pattern: Amenajări interioare }
      - { label: Spații comerciale, field: categories, pattern: Spații comerciale }
      - { label: Dotări pentru turism, field: categories, pattern: Dotări pentru turism }
    preview_path: 'proiecte/{{slug}}/'
    fields:
      - { name: title, label: Titlu, widget: string, hint: 'Ex.: Casa V/O' }
      - { name: location, label: Amplasament, widget: string, required: false, hint: 'Ex.: Brașov' }
      - { name: year, label: An, widget: string, required: false }
      - name: categories
        label: Categorii
        widget: select
        multiple: true
        min: 1
        options: [Construcții eficiente energetic, Structuri din lemn, Locuințe, Amenajări interioare, Spații comerciale, Dotări pentru turism]
      - { name: summary, label: Descriere scurtă, widget: text, hint: 'Una-două fraze. Apare sub titlu și în listări.' }
      - name: highlights
        label: Puncte cheie
        widget: list
        required: false
        hint: '2–3 rânduri scurte, apar în „Fișă tehnică” pe card și în slider.'
        field: { name: item, label: Punct, widget: string }
      - name: order
        label: Ordine în listă
        widget: number
        value_type: float
        default: 0
        hint: 'Numărul mai mic apare primul. Proiectele existente au 10, 20, 30… Pune 5 ca să apară primul.'
      - { name: featured, label: În sliderul mare de pe prima pagină, widget: boolean, default: false, hint: 'Alege proiecte cu fotografii orizontale foarte bune; titlul site-ului apare peste ele.' }
      - { name: cover, label: Fotografie copertă, widget: image, choose_url: false }
      - name: gallery
        label: Galerie foto
        widget: list
        required: false
        hint: 'Trage rândurile pentru a schimba ordinea.'
        summary: '{{fields.caption}}'
        fields:
          - { name: src, label: Fotografie, widget: image, choose_url: false }
          - { name: caption, label: Legendă (opțional), widget: string, required: false }
      - name: area
        label: Suprafețe (mp)
        widget: object
        required: false
        collapsed: false
        hint: 'Doar cifre. Apar în fișa proiectului și vor fi folosite la filtre.'
        fields:
          - { name: land, label: Suprafață teren, widget: number, value_type: float, required: false }
          - { name: built, label: Suprafață construită, widget: number, value_type: float, required: false }
          - { name: gross, label: Suprafață desfășurată, widget: number, value_type: float, required: false }
      - { name: region, label: Zonă (pentru filtre), widget: select, required: false, options: ['Brașov', 'Împrejurimi Brașov', 'Prahova', 'București și Ilfov', 'Alte zone'] }
      - { name: structure, label: Structură (pentru filtre), widget: select, required: false, options: ['Lemn', 'Zidărie', 'Metal'] }
      - { name: video, label: Video (opțional), widget: file, required: false, media_folder: /public/video, public_folder: /video, hint: 'Fișier .mp4, sub 25 MB.' }
      - name: facts
        label: Fișa proiectului
        widget: list
        required: false
        hint: 'Alte date, ex.: Stadiu — Finalizat. Suprafețele se completează mai sus.'
        summary: '{{fields.k}}: {{fields.v}}'
        fields:
          - { name: k, label: Denumire, widget: string }
          - { name: v, label: Valoare, widget: string }
      - name: technical
        label: Date tehnice
        widget: list
        required: false
        hint: 'Ex.: Necesar de căldură — 15 kWh/m²an; Etanșeitate n50 — 0,6 h⁻¹'
        summary: '{{fields.k}}: {{fields.v}}'
        fields:
          - { name: k, label: Denumire, widget: string }
          - { name: v, label: Valoare, widget: string }
      - name: quote
        label: Citat client
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: text, label: Citat, widget: text, required: false }
          - { name: author, label: Autor (opțional), widget: string, required: false }
      - { name: body, label: Text extins (opțional), widget: markdown, required: false, hint: 'Povestea proiectului: tema, contextul, soluțiile.' }
      - name: en
        label: English (versiunea în engleză)
        widget: object
        required: false
        collapsed: true
        hint: 'Textele pentru pagina în engleză. Ce lași gol apare în română.'
        fields:
          - { name: title, label: Title, widget: string, required: false, hint: 'Ex.: House V/O' }
          - { name: location, label: Location, widget: string, required: false, hint: 'Doar dacă diferă, ex.: Bucharest' }
          - { name: summary, label: Short description, widget: text, required: false }
          - { name: highlights, label: Key points, widget: list, required: false, field: { name: item, label: Point, widget: string } }
          - name: facts
            label: Project sheet
            widget: list
            required: false
            summary: '{{fields.k}}: {{fields.v}}'
            fields:
              - { name: k, label: Label, widget: string }
              - { name: v, label: Value, widget: string }
          - name: technical
            label: Technical data
            widget: list
            required: false
            summary: '{{fields.k}}: {{fields.v}}'
            fields:
              - { name: k, label: Label, widget: string }
              - { name: v, label: Value, widget: string }
          - { name: captions, label: Photo captions (în ordinea galeriei), widget: list, required: false, field: { name: item, label: Caption, widget: string, required: false } }
          - { name: quote, label: Client quote, widget: text, required: false }
      - { name: placeholderPhotos, widget: hidden, default: false }
      - { name: oldPath, widget: hidden }

  - name: settings
    label: Setări site
    editor: { preview: false }
    files:
      - name: site
        label: Texte și date de contact
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Nume scurt, widget: string }
          - { name: company, label: Firmă, widget: string }
          - { name: city, label: Oraș, widget: string }
          - { name: email, label: Email, widget: string }
          - { name: phone, label: Telefon, widget: string, required: false, hint: 'Lasă gol ca să nu apară pe site.' }
          - { name: facebook, label: Pagina de Facebook, widget: string }
          - { name: description, label: Descriere pentru Google, widget: text, hint: 'Apare în rezultatele căutării. Maxim ~160 de caractere.' }
          - name: hero
            label: Prima pagină — titlu
            widget: object
            fields:
              - { name: eyebrow, label: Rândul mic de deasupra, widget: string }
              - { name: title, label: Titlu mare (peste fotografie), widget: string }
              - { name: lede, label: Text sub fraza mare, widget: text }
          - name: manifesto
            label: Fraza mare de pe prima pagină
            widget: object
            fields:
              - { name: label, label: Eticheta din stânga, widget: string }
              - name: text
                label: Fraza
                widget: text
                hint: 'Cuvintele cu link se scriu așa: [interioare](/proiecte/?categorie=amenajari-interioare). Categorii: constructii-eficiente-energetic, structuri-din-lemn, locuinte, amenajari-interioare, spatii-comerciale, dotari-pentru-turism.'
          - name: specialties
            label: Specialități coordonate
            widget: list
            hint: 'Numărul lor apare în banda cu cifre de pe prima pagină.'
            field: { name: item, label: Specialitate, widget: string }
          - name: team
            label: Echipa
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: Nume, widget: string }
              - { name: role, label: Rol, widget: string }
              - { name: photo, label: Portret, widget: image, required: false, choose_url: false, hint: 'Format vertical, 4:5.' }
              - { name: mark, label: Logo personal (opțional), widget: image, required: false, choose_url: false }
          - { name: footerCta, label: Fraza din subsol, widget: string }
          - name: stats
            label: Banda cu cifre
            widget: list
            hint: 'Cifrele de pe banda petrol de pe prima pagină. Ex.: 120 + „proiecte realizate”, 20 + „ani de experiență”.'
            summary: '{{fields.value}}{{fields.suffix}} {{fields.label}}'
            max: 4
            fields:
              - { name: value, label: Număr, widget: number, value_type: int }
              - { name: suffix, label: Semn după număr (opțional), widget: string, required: false, hint: 'Ex.: + sau %' }
              - { name: label, label: Text, widget: string }
          - name: contact
            label: Contact și hartă
            widget: object
            fields:
              - { name: title, label: Titlu secțiune, widget: string }
              - { name: intro, label: Text introductiv, widget: text, required: false }
              - { name: address, label: Adresă, widget: string }
              - { name: city, label: Oraș, widget: string }
              - { name: hours, label: Program (opțional), widget: string, required: false, hint: 'Ex.: Luni–Vineri, 9–17' }
              - { name: mapQuery, label: Căutare pe hartă, widget: string, hint: 'Ce se caută în Google Maps pentru pin. Poți pune și numele firmei, dacă e înregistrată pe Google.' }
          - name: reviews
            label: Recenzii clienți
            widget: object
            hint: 'Secțiunea apare pe site doar când există cel puțin o recenzie.'
            fields:
              - { name: title, label: Titlu secțiune, widget: string }
              - { name: googleUrl, label: Link către recenziile Google, widget: string, required: false }
              - { name: rating, label: Nota medie Google, widget: string, required: false, hint: 'Ex.: 4,9' }
              - { name: count, label: Număr total de recenzii, widget: string, required: false }
              - name: items
                label: Recenzii
                widget: list
                required: false
                summary: '{{fields.author}}'
                fields:
                  - { name: author, label: Nume, widget: string }
                  - { name: rating, label: Stele (opțional), widget: number, value_type: int, min: 1, max: 5, required: false }
                  - { name: date, label: Data (opțional), widget: string, required: false, hint: 'Ex.: martie 2025' }
                  - { name: text, label: Text recenzie, widget: text }
      - name: site_en
        label: Texte în engleză (/en/)
        file: src/data/site.en.json
        format: json
        fields:
          - { name: description, label: Description (Google), widget: text, required: false }
          - name: hero
            label: Slider title
            widget: object
            fields:
              - { name: eyebrow, label: Small line above, widget: string, required: false }
              - { name: title, label: Title, widget: string, required: false }
              - { name: lede, label: Short text under the statement, widget: text, required: false }
          - name: manifesto
            label: Statement („Ce facem”)
            widget: object
            fields:
              - { name: label, label: Label, widget: string, required: false }
              - { name: text, label: Text, widget: text, required: false, hint: 'Links: [energy-efficient homes](/en/projects/?categorie=constructii-eficiente-energetic)' }
          - { name: specialties, label: Specialties, widget: list, required: false, field: { name: item, label: Item, widget: string } }
          - name: team
            label: Team roles (same order as in Romanian)
            widget: list
            required: false
            fields:
              - { name: role, label: Role, widget: string }
          - name: stats
            label: Numbers band labels (same order as in Romanian)
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
          - { name: footerCta, label: Footer sentence, widget: string, required: false }
          - name: contact
            label: Contact
            widget: object
            fields:
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: city, label: City, widget: string, required: false }
              - { name: hours, label: Opening hours, widget: string, required: false }
          - name: reviews
            label: Reviews
            widget: object
            fields:
              - { name: title, label: Title, widget: string, required: false }
